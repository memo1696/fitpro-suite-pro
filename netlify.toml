# ==============================================================================
# 🛡️ FITPRO SUITE PRO — NETLIFY SECURITY & DEPLOYMENT CONFIGURATION
# ==============================================================================

[build]
  publish = "."
  functions = "functions"

# ------------------------------------------------------------------------------
# 🔒 CABECERAS DE SEGURIDAD ESTRICTAS (HTTP HEADERS)
# ------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Prevención de clickjacking bloqueando incrustación en iframes
    X-Frame-Options = "DENY"
    
    # Bloqueo de detección automática de tipos MIME (MIME-sniffing)
    X-Content-Type-Options = "nosniff"
    
    # Filtro XSS legacy del navegador
    X-XSS-Protection = "1; mode=block"
    
    # Control estricto de información enviada en el header Referer
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Restricción de permisos y APIs sensibles del dispositivo
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    
    # Forzar HTTPS con HSTS (HTTP Strict Transport Security)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # Política de Seguridad de Contenido (Content Security Policy - CSP)
    # Permite orígenes autorizados para Supabase, Google Fonts, CDNs de jsPDF y EmailJS
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://rshpzqppvciujwtuzniv.supabase.co;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https:;
      connect-src 'self' https://rshpzqppvciujwtuzniv.supabase.co wss://rshpzqppvciujwtuzniv.supabase.co https://api.emailjs.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
      object-src 'none';
    """

# ------------------------------------------------------------------------------
# 📱 PWA & SERVICE WORKER CACHING (NO-CACHE FOR SW)
# ------------------------------------------------------------------------------
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=UTF-8"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=UTF-8"

# ------------------------------------------------------------------------------
# ⚡ CACHING OPTIMIZADO PARA ASSETS ESTÁTICOS
# ------------------------------------------------------------------------------
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# ------------------------------------------------------------------------------
# 🔄 REDIRECCIONES SPA (SINGLE PAGE APPLICATION)
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
